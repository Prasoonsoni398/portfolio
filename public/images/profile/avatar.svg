<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20b8cd"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="200" fill="url(#avatarBg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#neonRing)" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Developer Silhouette with Glasses / Modern Tech Vibe -->
  <circle cx="200" cy="150" r="60" fill="#334155"/>
  <path d="M110 320 C110 240, 290 240, 290 320 Z" fill="#1e293b"/>
  <!-- Glasses -->
  <rect x="160" y="140" width="30" height="20" rx="5" fill="#20b8cd" fill-opacity="0.3" stroke="#20b8cd" stroke-width="2"/>
  <rect x="210" y="140" width="30" height="20" rx="5" fill="#20b8cd" fill-opacity="0.3" stroke="#20b8cd" stroke-width="2"/>
  <line x1="190" y1="150" x2="210" y2="150" stroke="#20b8cd" stroke-width="2"/>

  <!-- Code brackets floating -->
  <text x="75" y="180" fill="#20b8cd" font-family="monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>
  <text x="290" y="180" fill="#10b981" font-family="monospace" font-size="28" font-weight="bold">{ ; }</text>
</svg>
