<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgForm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgForm)" rx="16"/>
  
  <!-- Header Bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <circle cx="60" cy="55" r="6" fill="#ef4444"/>
  <circle cx="80" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="55" r="6" fill="#10b981"/>
  <text x="130" y="60" fill="#fafafa" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🛠️ FormSchema Builder — Drag &amp; Drop Canvas</text>
  <rect x="630" y="42" width="120" height="26" rx="6" fill="url(#indigoGrad)"/>
  <text x="690" y="59" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Export Schema</text>

  <!-- Left: Element Palette -->
  <rect x="30" y="100" width="200" height="370" rx="12" fill="#202023" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="50" y="135" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">FIELD PALETTE</text>

  <rect x="45" y="150" width="170" height="36" rx="8" fill="#27272a" stroke="#52525b" stroke-dasharray="4"/>
  <text x="60" y="173" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13">≡ Text Input</text>

  <rect x="45" y="195" width="170" height="36" rx="8" fill="#27272a" stroke="#52525b" stroke-dasharray="4"/>
  <text x="60" y="218" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13">≡ Email Address</text>

  <rect x="45" y="240" width="170" height="36" rx="8" fill="#27272a" stroke="#52525b" stroke-dasharray="4"/>
  <text x="60" y="263" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13">≡ Dropdown Select</text>

  <rect x="45" y="285" width="170" height="36" rx="8" fill="#27272a" stroke="#52525b" stroke-dasharray="4"/>
  <text x="60" y="308" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="13">≡ Checkbox Group</text>

  <!-- Center Canvas -->
  <rect x="250" y="100" width="310" height="370" rx="12" fill="#18181b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="270" y="135" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ACTIVE BUILD CANVAS</text>
  
  <rect x="270" y="155" width="270" height="60" rx="8" fill="#27272a" stroke="#3f3f46"/>
  <text x="285" y="178" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Full Name *</text>
  <rect x="285" y="185" width="240" height="20" rx="4" fill="#18181b"/>

  <rect x="270" y="230" width="270" height="60" rx="8" fill="#27272a" stroke="#3f3f46"/>
  <text x="285" y="253" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Work Email *</text>
  <rect x="285" y="260" width="240" height="20" rx="4" fill="#18181b"/>

  <!-- Insertion indicator -->
  <line x1="270" y1="310" x2="540" y2="310" stroke="#6366f1" stroke-width="2" stroke-dasharray="5"/>

  <!-- Right: Generated JSON Schema preview -->
  <rect x="580" y="100" width="190" height="370" rx="12" fill="#141416" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="595" y="135" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">LIVE JSON SCHEMA</text>
  <text x="595" y="165" fill="#818cf8" font-family="monospace" font-size="11">{"type": "object",</text>
  <text x="595" y="185" fill="#a5b4fc" font-family="monospace" font-size="11"> "required": [</text>
  <text x="610" y="205" fill="#4ade80" font-family="monospace" font-size="11">  "fullName",</text>
  <text x="610" y="225" fill="#4ade80" font-family="monospace" font-size="11">  "workEmail"</text>
  <text x="595" y="245" fill="#a5b4fc" font-family="monospace" font-size="11"> ],</text>
  <text x="595" y="265" fill="#a5b4fc" font-family="monospace" font-size="11"> "properties": {..}}</text>
</svg>
