<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgChat)" rx="16"/>
  <!-- Top App Bar -->
  <rect x="30" y="30" width="740" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="60" cy="55" r="6" fill="#ef4444"/>
  <circle cx="80" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="100" cy="55" r="6" fill="#10b981"/>
  <text x="130" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚡ Real-Time Collaborative Workspace (WebSocket: Connected)</text>
  
  <!-- Left Channels Panel -->
  <rect x="30" y="100" width="220" height="370" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ACTIVE CHANNELS</text>
  <rect x="45" y="150" width="190" height="36" rx="8" fill="url(#accentCyan)"/>
  <text x="65" y="173" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600"># dev-collaboration</text>
  <circle cx="215" cy="168" r="4" fill="#22c55e"/>

  <rect x="45" y="195" width="190" height="36" rx="8" fill="#0f172a" fill-opacity="0.4"/>
  <text x="65" y="218" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13"># api-architecture</text>
  
  <rect x="45" y="240" width="190" height="36" rx="8" fill="#0f172a" fill-opacity="0.4"/>
  <text x="65" y="263" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13"># sprint-updates</text>

  <!-- Right Chat Stream -->
  <rect x="270" y="100" width="500" height="370" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Message 1 from user -->
  <circle cx="305" cy="140" r="16" fill="#06b6d4"/>
  <text x="305" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">PS</text>
  <text x="335" y="135" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Prasoon Soni <tspan fill="#64748b" font-weight="normal" font-size="11">10:42 AM</tspan></text>
  <rect x="335" y="145" width="340" height="42" rx="10" fill="#1e293b"/>
  <text x="350" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">WebSocket latency benchmark is under 60ms now!</text>

  <!-- Message 2 response -->
  <circle cx="305" cy="220" r="16" fill="#8b5cf6"/>
  <text x="305" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">AL</text>
  <text x="335" y="215" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Alex Rivera <tspan fill="#64748b" font-weight="normal" font-size="11">10:43 AM</tspan></text>
  <rect x="335" y="225" width="380" height="58" rx="10" fill="#1e293b"/>
  <text x="350" y="250" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">Incredible work. Reconnection fallback handling</text>
  <text x="350" y="270" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">works seamlessly even with simulated network jitter.</text>

  <!-- Typing indicator -->
  <text x="300" y="405" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="12">Alex is typing...</text>

  <!-- Input bar -->
  <rect x="290" y="415" width="460" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="310" y="440" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Type a real-time message...</text>
  <rect x="680" y="422" width="60" height="28" rx="6" fill="#06b6d4"/>
  <text x="710" y="440" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Send</text>
</svg>
